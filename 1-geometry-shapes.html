<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometrische Vormen</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .canvas-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        canvas {
            border: 3px solid #667eea;
            border-radius: 10px;
            background: #f8f9fa;
            max-width: 100%;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .control-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            color: #667eea;
            font-weight: bold;
            margin-top: 5px;
        }
        .shape-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        button.active {
            background: #764ba2;
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Geometrische Vormen</h1>
        
        <div class="shape-buttons">
            <button class="active" onclick="setShape('circle')">⭕ Cirkel</button>
            <button onclick="setShape('square')">⬜ Vierkant</button>
            <button onclick="setShape('triangle')">🔺 Driehoek</button>
            <button onclick="setShape('star')">⭐ Ster</button>
            <button onclick="setShape('polygon')">🔷 Veelhoek</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="600" height="400"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="rotation">Rotatie</label>
                <input type="range" id="rotation" min="0" max="360" value="0">
                <div class="value-display" id="rotationValue">0°</div>
            </div>
            <div class="control-group">
                <label for="scale">Schaal</label>
                <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1">
                <div class="value-display" id="scaleValue">1x</div>
            </div>
            <div class="control-group">
                <label for="sides">Zijden (veelhoek)</label>
                <input type="range" id="sides" min="3" max="12" value="6">
                <div class="value-display" id="sidesValue">6</div>
            </div>
            <div class="control-group">
                <label for="color">Kleur</label>
                <input type="color" id="color" value="#667eea" style="width: 100%; height: 40px; cursor: pointer;">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentShape = 'circle';
        let rotation = 0;
        let scale = 1;
        let sides = 6;
        let color = '#667eea';

        document.getElementById('rotation').addEventListener('input', (e) => {
            rotation = e.target.value;
            document.getElementById('rotationValue').textContent = rotation + '°';
            draw();
        });

        document.getElementById('scale').addEventListener('input', (e) => {
            scale = e.target.value;
            document.getElementById('scaleValue').textContent = scale + 'x';
            draw();
        });

        document.getElementById('sides').addEventListener('input', (e) => {
            sides = e.target.value;
            document.getElementById('sidesValue').textContent = sides;
            draw();
        });

        document.getElementById('color').addEventListener('input', (e) => {
            color = e.target.value;
            draw();
        });

        function setShape(shape) {
            currentShape = shape;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            draw();
        }

        function drawCircle() {
            ctx.beginPath();
            ctx.arc(300, 200, 80 * scale, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawSquare() {
            ctx.fillStyle = color;
            ctx.fillRect(-80 * scale, -80 * scale, 160 * scale, 160 * scale);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(-80 * scale, -80 * scale, 160 * scale, 160 * scale);
        }

        function drawTriangle() {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -80 * scale);
            ctx.lineTo(80 * scale, 80 * scale);
            ctx.lineTo(-80 * scale, 80 * scale);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawStar() {
            const points = 5;
            const outerRadius = 80 * scale;
            const innerRadius = 40 * scale;
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / points - Math.PI / 2;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPolygon() {
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = (i * 2 * Math.PI) / sides - Math.PI / 2;
                const x = Math.cos(angle) * 80 * scale;
                const y = Math.sin(angle) * 80 * scale;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(300, 200);
            ctx.rotate((rotation * Math.PI) / 180);

            switch (currentShape) {
                case 'circle':
                    drawCircle();
                    break;
                case 'square':
                    drawSquare();
                    break;
                case 'triangle':
                    drawTriangle();
                    break;
                case 'star':
                    drawStar();
                    break;
                case 'polygon':
                    drawPolygon();
                    break;
            }
            ctx.restore();
        }

        draw();
    </script>
</body>
</html>
