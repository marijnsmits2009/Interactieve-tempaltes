<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golfbeweging</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .canvas-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        canvas {
            border: 3px solid #f5576c;
            border-radius: 10px;
            background: #f8f9fa;
            max-width: 100%;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #f5576c;
        }
        .control-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            color: #f5576c;
            font-weight: bold;
            margin-top: 5px;
        }
        .wave-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #f5576c;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #f093fb;
            transform: translateY(-2px);
        }
        button.active {
            background: #f093fb;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>〰️ Golfbeweging</h1>
        
        <div class="wave-buttons">
            <button class="active" onclick="setWave('sine')">🌊 Sinus</button>
            <button onclick="setWave('cosine')">〰️ Cosinus</button>
            <button onclick="setWave('square')">⬜ Blokgolf</button>
            <button onclick="setWave('triangle')">🔺 Driehoeksgolf</button>
            <button onclick="setWave('sawtooth')">⚡ Zaagtand</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="900" height="300"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="amplitude">Amplitude</label>
                <input type="range" id="amplitude" min="10" max="100" value="50">
                <div class="value-display" id="amplitudeValue">50px</div>
            </div>
            <div class="control-group">
                <label for="frequency">Frequentie</label>
                <input type="range" id="frequency" min="0.5" max="5" step="0.5" value="1">
                <div class="value-display" id="frequencyValue">1x</div>
            </div>
            <div class="control-group">
                <label for="phase">Faseverschuiving</label>
                <input type="range" id="phase" min="0" max="360" value="0">
                <div class="value-display" id="phaseValue">0°</div>
            </div>
            <div class="control-group">
                <label for="speed">Snelheid</label>
                <input type="range" id="speed" min="0.5" max="3" step="0.5" value="1">
                <div class="value-display" id="speedValue">1x</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentWave = 'sine';
        let amplitude = 50;
        let frequency = 1;
        let phase = 0;
        let speed = 1;
        let time = 0;

        document.getElementById('amplitude').addEventListener('input', (e) => {
            amplitude = e.target.value;
            document.getElementById('amplitudeValue').textContent = amplitude + 'px';
        });

        document.getElementById('frequency').addEventListener('input', (e) => {
            frequency = e.target.value;
            document.getElementById('frequencyValue').textContent = frequency + 'x';
        });

        document.getElementById('phase').addEventListener('input', (e) => {
            phase = e.target.value;
            document.getElementById('phaseValue').textContent = phase + '°';
        });

        document.getElementById('speed').addEventListener('input', (e) => {
            speed = e.target.value;
            document.getElementById('speedValue').textContent = speed + 'x';
        });

        function setWave(wave) {
            currentWave = wave;
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function drawWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Axis
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // Draw wave
            ctx.strokeStyle = '#f5576c';
            ctx.lineWidth = 3;
            ctx.beginPath();

            for (let x = 0; x < canvas.width; x += 2) {
                let y;
                const normalized = (x / canvas.width) * frequency * 2 * Math.PI + (phase * Math.PI / 180) + time * speed * 0.05;

                switch (currentWave) {
                    case 'sine':
                        y = Math.sin(normalized) * amplitude + canvas.height / 2;
                        break;
                    case 'cosine':
                        y = Math.cos(normalized) * amplitude + canvas.height / 2;
                        break;
                    case 'square':
                        y = (Math.sin(normalized) > 0 ? 1 : -1) * amplitude + canvas.height / 2;
                        break;
                    case 'triangle':
                        const t = (normalized % (2 * Math.PI)) / (2 * Math.PI);
                        y = (t < 0.5 ? 4 * t - 1 : 3 - 4 * t) * amplitude + canvas.height / 2;
                        break;
                    case 'sawtooth':
                        y = ((normalized % (2 * Math.PI)) / (2 * Math.PI) * 2 - 1) * amplitude + canvas.height / 2;
                        break;
                }

                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function animate() {
            drawWave();
            time++;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
