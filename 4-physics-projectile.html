<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectielbeweging</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .canvas-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 10px;
            padding: 20px;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 5px;
            background: white;
            max-width: 100%;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00f2fe;
        }
        .control-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            color: #4facfe;
            font-weight: bold;
            margin-top: 5px;
        }
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #4facfe;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #00f2fe;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Projectielbeweging</h1>
        
        <div class="buttons">
            <button onclick="reset()">🔄 Reset</button>
            <button onclick="togglePause()">⏸️ Pauze/Afspelen</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="400"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="angle">Hoek (graden)</label>
                <input type="range" id="angle" min="0" max="90" value="45">
                <div class="value-display" id="angleValue">45°</div>
            </div>
            <div class="control-group">
                <label for="velocity">Beginsnelheid</label>
                <input type="range" id="velocity" min="5" max="50" value="30">
                <div class="value-display" id="velocityValue">30 m/s</div>
            </div>
            <div class="control-group">
                <label for="gravity">Zwaartekracht</label>
                <input type="range" id="gravity" min="1" max="20" value="9.8">
                <div class="value-display" id="gravityValue">9.8 m/s²</div>
            </div>
            <div class="control-group">
                <label for="mass">Massa</label>
                <input type="range" id="mass" min="0.5" max="5" step="0.5" value="1">
                <div class="value-display" id="massValue">1 kg</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let angle = 45;
        let velocity = 30;
        let gravity = 9.8;
        let mass = 1;
        let isPaused = false;
        let trajectories = [];

        const scale = 2;
        const ground = canvas.height - 40;

        document.getElementById('angle').addEventListener('input', (e) => {
            angle = e.target.value;
            document.getElementById('angleValue').textContent = angle + '°';
        });

        document.getElementById('velocity').addEventListener('input', (e) => {
            velocity = e.target.value;
            document.getElementById('velocityValue').textContent = velocity + ' m/s';
        });

        document.getElementById('gravity').addEventListener('input', (e) => {
            gravity = e.target.value;
            document.getElementById('gravityValue').textContent = gravity + ' m/s²';
        });

        document.getElementById('mass').addEventListener('input', (e) => {
            mass = e.target.value;
            document.getElementById('massValue').textContent = mass + ' kg';
        });

        function reset() {
            trajectories = [];
            isPaused = false;
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        function launch() {
            const rad = (angle * Math.PI) / 180;
            const vx = velocity * Math.cos(rad);
            const vy = velocity * Math.sin(rad);
            const trajectory = [];

            let t = 0;
            while (true) {
                const x = 50 + vx * t * scale;
                const y = ground - (vy * t * scale - 0.5 * gravity * t * t * scale);

                if (y > ground) break;

                trajectory.push({ x, y, t, vx, vy });
                t += 0.05;
            }

            trajectories.push({ trajectory, index: 0 });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, ground);
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, ground, canvas.width, canvas.height - ground);

            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, ground);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            for (let traj of trajectories) {
                ctx.strokeStyle = 'rgba(0, 100, 200, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < traj.trajectory.length; i++) {
                    const p = traj.trajectory[i];
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();

                if (traj.index < traj.trajectory.length) {
                    const p = traj.trajectory[traj.index];
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#FFD93D';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + p.vx * scale * 0.3, p.y - p.vy * scale * 0.3);
                    ctx.stroke();

                    if (!isPaused) {
                        traj.index++;
                    }
                }
            }

            const launchRad = (angle * Math.PI) / 180;
            const launchX = 50;
            const launchY = ground;
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(launchX, launchY);
            ctx.lineTo(launchX + Math.cos(launchRad) * 30, launchY - Math.sin(launchRad) * 30);
            ctx.stroke();

            ctx.fillStyle = '#333';
            ctx.fillRect(launchX - 15, launchY, 30, 10);
        }

        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        setInterval(() => {
            if (!isPaused && trajectories.every(t => t.index >= t.trajectory.length)) {
                launch();
            }
        }, 2000);

        launch();
        animate();
    </script>
</body>
</html>
